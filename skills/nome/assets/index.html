<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NOME · 个人档案</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="preload" as="image" href="/textures/ultraviolet-sky.webp">
  <link rel="preload" as="font" href="/fonts/michroma-regular.ttf" type="font/ttf" crossorigin>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main id="main">
    <h1 class="sr-only">NOME · 个人星图</h1>
    <p id="loading" class="loading" role="status">正在读取星图…</p>
    <section id="error" class="error" role="alert" hidden>
      <h2>暂时无法读取。</h2><p id="error-message"></p><p class="muted">检查本机服务后，重新加载页面。</p>
      <button id="retry" class="text-button" type="button">重新读取</button>
    </section>
    <div id="dashboard" class="universe" hidden>
      <section class="star-stage" aria-label="个人星图">
        <div class="brand-wordmark" aria-hidden="true">NOME</div>
        <div id="atlas" class="atlas" role="group" aria-label="选择一个领域，探索你的档案"></div>
      </section>
      <section id="detail" class="reading" aria-labelledby="detail-title" hidden>
        <div class="reading-toolbar">
          <button id="back-to-atlas" class="text-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>返回星图</button>
          <p id="demo-note" class="demo-note" hidden>虚构示例</p>
        </div>
        <div class="detail-content">
          <h2 id="detail-title" tabindex="-1"></h2>
          <nav id="chapter-nav" class="chapter-nav" aria-label="文档章节" hidden></nav>
          <div id="detail-documents"></div>
        </div>
        <nav id="domain-nav" class="domain-nav" aria-label="切换档案领域"></nav>
      </section>
    </div>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
