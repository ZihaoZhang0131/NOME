<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>NOME · 个人档案</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到档案内容</a>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="NOME 首页"><span class="brand-mark" aria-hidden="true">n.</span><span>NOME</span></a>
      <p class="sidebar-caption">关于你，慢慢了解。</p>
      <p class="nav-label">个人档案</p>
      <nav id="navigation" aria-label="按领域筛选"></nav>
      <div class="sidebar-bottom"><span class="local-dot" aria-hidden="true"></span>本机档案<span class="version">v0.1</span></div>
    </aside>
    <main id="main" tabindex="-1">
      <header class="topbar">
        <span class="breadcrumb">NOME <span>/</span> 个人档案</span>
        <div class="topbar-actions"><span id="demo-badge" class="demo-badge" hidden>虚构示例</span><button id="refresh" class="refresh" type="button"><span aria-hidden="true">↻</span> 刷新</button></div>
      </header>
      <div class="content">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">YOUR PERSONAL CONTEXT</p>
          <h1 id="page-title">让协作，从了解你开始。</h1>
          <p class="intro-copy">这里记录你愿意让 Agent 了解的事。由你补充，也由你决定何时改变。</p>
        </section>
        <p id="error" class="error" role="alert" hidden></p>
        <div id="loading" class="loading" role="status">正在读取本机档案…</div>
        <div id="dashboard" hidden>
          <section class="overview" aria-label="了解情况">
            <div class="overview-main"><span id="coverage" class="coverage">0 <small>/ 6</small></span><div><p class="overview-label">个领域已有确认资料</p><p id="coverage-note" class="muted">从你现在最关心的事情开始就好。</p></div></div>
            <div class="overview-side"><div><strong id="pending-count">0</strong><span>条待核实</span></div><div><strong id="draft-count">0</strong><span>条草稿</span></div></div>
            <div id="coverage-track" class="coverage-track" aria-hidden="true"></div>
          </section>
          <div class="section-heading"><h2 id="section-title">了解你的六个方面</h2><span id="updated" class="muted"></span></div>
          <div id="domains" class="domains"></div>
          <section class="next-step" aria-labelledby="next-title"><span class="next-icon" aria-hidden="true">↗</span><div><h2 id="next-title">想补充一点，或改变一点？</h2><p>回到 Agent 对话，说「进入 NOME 问答模式」或「帮我更新个人档案」。这里仅供查看。</p></div></section>
          <footer><span>了解可以慢慢发生，不必填满每个领域。</span><span id="revision"></span></footer>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
